<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SinD \u8f68\u8ff9\u67e5\u770b</title><style>body{font-family:Arial,"Microsoft YaHei",sans-serif;margin:18px;background:#f4f7fb;color:#172033}.shell{max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;margin-top:12px}.card{background:#fff;border:1px solid #d4dce8;border-radius:8px;padding:12px}.toolbar,.layers{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}button,input,select{font:inherit}button{padding:6px 10px;border:1px solid #b8c3d4;border-radius:5px;background:#fff;cursor:pointer}.plotbox{height:min(72vh,760px);min-height:480px;position:relative}.plot{width:100%;height:100%;background:#fbfcfe;border:1px solid #dce3ee}.legend span{display:block;margin:8px 0;font-size:13px}.sw{display:inline-block;width:28px;border-top:3px solid;margin-right:5px}.hist{border-color:#1772b8;border-width:2px}.gt{border-color:#159447}.pred{border-color:#e37b08;border-style:dashed}.gap{border-color:#cf2d37;border-style:dashed;border-width:2px}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.metric div{padding:7px;border:1px solid #dce3ee}.metric b,.metric small{display:block}.axis{font-size:12px;fill:#4e6074}.gridline{stroke:#dfe5ee}.label{font-size:12px;paint-order:stroke;stroke:#fff;stroke-width:3px}.nodes{width:100%;border-collapse:collapse;font-size:13px}.nodes td,.nodes th{padding:5px;border-bottom:1px solid #e5e9f0}.point-hit{fill:transparent;stroke:transparent;stroke-width:14px;cursor:crosshair}.tip{display:none;position:absolute;background:#172033;color:#fff;padding:7px;border-radius:4px;font-size:12px;pointer-events:none}.error{color:#a52a35;background:#fff0f1;padding:10px}@media(max-width:980px){.layout{grid-template-columns:1fr}}</style></head><body><main class="shell"><div id="app">Loading...</div></main><script>

(function(){"use strict";var C={h:"#1772b8",g:"#159447",p:"#e37b08",r:"#cf2d37"},S={data:null,manifest:null,index:0,step:999,play:false,selected:null,visible:{},show:{h:true,g:true,p:true,r:true,e:true,l:true},speed:500},app=document.getElementById("app");function pt(p){return Array.isArray(p)&&p.length===2&&p.every(Number.isFinite)}function esc(s){return String(s).replace(/[&<>\"]/g,function(x){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[x]})}function fmt(x,d){return x==null?'N/A':Number(x).toFixed(d||2)}function chosen(){return S.data.nodes.filter(function(n){return S.visible[n.node_id]})}function bd(){var x=[],y=[];chosen().forEach(function(n){[n.history,n.ground_truth,n.prediction].forEach(function(a){a.forEach(function(p){if(pt(p)){x.push(p[0]);y.push(p[1])}})})});var a=Math.min.apply(null,x),b=Math.max.apply(null,x),c=Math.min.apply(null,y),d=Math.max.apply(null,y),q=.08*Math.max(b-a,d-c,1);return{x:a-q,X:b+q,y:c-q,Y:d+q}}function path(a,l,sx,sy){var z='',on=false;for(var i=0;i<a.length&&i<=l;i++){var p=a[i];if(!pt(p)){on=false;continue}z+=(on?'L':'M')+sx(p[0])+','+sy(p[1]);on=true}return z}function cell(n,v,u){return'<div><b>'+fmt(v)+' '+esc(u)+'</b><small>'+n+'</small></div>'}
function draw(){var d=S.data,M=d.future_steps-1;S.step=Math.min(S.step,M);var q=bd(),W=1000,H=650,m={l:65,r:20,t:20,b:50},sx=function(x){return m.l+(x-q.x)/(q.X-q.x)*(W-m.l-m.r)},sy=function(y){return H-m.b-(y-q.y)/(q.Y-q.y)*(H-m.t-m.b)},svg='<svg id="plot" class="plot" viewBox="0 0 '+W+' '+H+'">';for(var i=0;i<=5;i++){var x=m.l+i*(W-m.l-m.r)/5,v=q.x+i*(q.X-q.x)/5;svg+='<line class="gridline" x1="'+x+'" y1="'+m.t+'" x2="'+x+'" y2="'+(H-m.b)+'"/><text class="axis" x="'+x+'" y="'+(H-25)+'" text-anchor="middle">'+fmt(v,1)+'</text>'}for(var j=0;j<=5;j++){var y=H-m.b-j*(H-m.t-m.b)/5,v2=q.y+j*(q.Y-q.y)/5;svg+='<line class="gridline" x1="'+m.l+'" y1="'+y+'" x2="'+(W-m.r)+'" y2="'+y+'"/><text class="axis" x="50" y="'+(y+4)+'" text-anchor="end">'+fmt(v2,1)+'</text>'}svg+='<text class="axis" x="500" y="645" text-anchor="middle">X ('+esc(d.coordinate_unit)+')</text><text class="axis" transform="translate(14 325) rotate(-90)" text-anchor="middle">Y ('+esc(d.coordinate_unit)+')</text>';chosen().forEach(function(n){var o=S.selected!=null&&S.selected!==n.node_id?.45:1,A='opacity="'+o+'"',h=n.history.map(function(p){return pt(p)?[sx(p[0]),sy(p[1])]:null}),g=n.ground_truth.map(function(p){return pt(p)?[sx(p[0]),sy(p[1])]:null}),p=n.prediction.map(function(v){return pt(v)?[sx(v[0]),sy(v[1])]:null}),he=h.filter(Boolean).pop(),ge=g.filter(Boolean).pop(),pe=p[Math.min(S.step,p.length-1)];if(S.show.h)svg+='<path '+A+' d="'+path(h,999,sx,sy)+'" fill="none" stroke="'+C.h+'" stroke-width="2"/>';if(S.show.g)svg+='<path '+A+' d="'+path(g,S.step,sx,sy)+'" fill="none" stroke="'+C.g+'" stroke-width="3"/>';if(S.show.p)svg+='<path '+A+' d="'+path(p,S.step,sx,sy)+'" fill="none" stroke="'+C.p+'" stroke-width="3" stroke-dasharray="9 6"/>';if(S.show.r&&he&&p[0])svg+='<line '+A+' x1="'+he[0]+'" y1="'+he[1]+'" x2="'+p[0][0]+'" y2="'+p[0][1]+'" stroke="'+C.r+'" stroke-width="2" stroke-dasharray="3 4"/>';if(S.show.e&&he)svg+='<circle '+A+' cx="'+he[0]+'" cy="'+he[1]+'" r="6" fill="white" stroke="'+C.h+'" stroke-width="2"/>';if(S.show.e&&ge)svg+='<rect '+A+' x="'+(ge[0]-5)+'" y="'+(ge[1]-5)+'" width="10" height="10" transform="rotate(45 '+ge[0]+' '+ge[1]+')" fill="white" stroke="'+C.g+'" stroke-width="2"/>';if(S.show.e&&pe)svg+='<polygon '+A+' points="'+pe[0]+','+(pe[1]-7)+' '+(pe[0]+7)+','+(pe[1]+6)+' '+(pe[0]-7)+','+(pe[1]+6)+'" fill="#fff7ed" stroke="'+C.p+'" stroke-width="2"/>';if(S.show.l&&he)svg+='<text '+A+' class="label" x="'+(he[0]+8)+'" y="'+(he[1]-8)+'" fill="'+C.h+'">\u8f66\u8f86 '+n.node_id+'</text>';[["history",h,S.show.h],["ground_truth",g,S.show.g],["prediction",p,S.show.p]].forEach(function(item){var kind=item[0],arr=item[1],on=item[2];if(!on)return;for(var z=0;z<arr.length&&z<=S.step;z++){var pp=arr[z];if(!pp)continue;var raw=n[kind][z],name=kind==="history"?"\u5386\u53f2\u8f68\u8ff9":kind==="ground_truth"?"\u771f\u5b9e\u672a\u6765":"\u9884\u6d4b\u672a\u6765";svg+='<circle class="point-hit" cx="'+pp[0]+'" cy="'+pp[1]+'" r="9"><title>\u8f66\u8f86 '+n.node_id+' | '+name+' | \u7b2c '+(z+1)+' \u6b65 | X='+fmt(raw[0],3)+', Y='+fmt(raw[1],3)+' '+d.coordinate_unit+'</title></circle>'}});});svg+='</svg>';var v=chosen().filter(function(n){return n.ade!=null}),ade=v.length?v.reduce(function(a,n){return a+n.ade},0)/v.length:null,f=v.filter(function(n){return n.fde!=null}),fde=f.length?f.reduce(function(a,n){return a+n.fde},0)/f.length:null,rows=S.data.nodes.filter(function(n){return n.ade!=null}).map(function(n){return'<tr><td>\u8f66\u8f86 '+n.node_id+'</td><td>'+n.valid_ground_truth.filter(Boolean).length+'</td><td>'+fmt(n.ade)+'</td><td>'+fmt(n.fde)+'</td><td><button data-focus="'+n.node_id+'">'+(S.selected===n.node_id?'\u53d6\u6d88\u805a\u7126':'\u805a\u7126')+'</button></td></tr>'}).join('');app.innerHTML='<div class="top"><div><h1>SinD 车辆轨迹诊断</h1><div class="subtitle">'+esc(d.split)+'｜样本 '+d.sample_index+'｜\u5355\u4f4d：'+esc(d.coordinate_unit)+'</div></div><div class="toolbar"><button id="prev">\u4e0a\u4e00\u6837\u672c</button><label>\u6837\u672c <input i ric">'+cell('\u663e\u793a\u8f66\u8f86\u5e73\u5747 ADE',ade,d.coordinate_unit)+cell('\u663e\u793a\u8f66\u8f86\u5e73\u5747 FDE',fde,d.coordinate_unit)+cell('\u5f53\u524d\u6b65\u9aa4',S.step+1,'/ '+d.future_steps)+'</div><h3>\u8f66\u8f86\u6307\u6807</h3><table class="nodes"><thead><tr><th>\u8f66\u8f86</th><th>\u6709\u6548\u70b9</th><th>ADE</th><th>FDE</th><th>\u64cd\u4f5c</th></tr></thead><tbody>'+rows+'</tbody></table></aside></div>';wire()}
function wire(){document.getElementById('prev').onclick=function(){loadIndex(S.index-1)};document.getElementById('next').onclick=function(){loadIndex(S.index+1)};document.getElementById('load').onclick=function(){loadIndex(Number(document.getElementById('sample').value))};document.getElementById('play').onclick=function(){S.play=!S.play;draw();if(S.play)tick()};document.getElementById('back').onclick=function(){S.step=Math.max(0,S.step-1);draw()};document.getElementById('forward').onclick=function(){S.step=Math.min(S.data.future_steps-1,S.step+1);draw()};document.getElementById('step').oninput=function(e){S.step=Number(e.target.value);draw()};document.getElementById('speed').onchange=function(e){S.speed=Number(e.target.value)};document.querySelectorAll('[data-show]').forEach(function(x){x.onchange=function(){S.show[x.dataset.show]=x.checked;draw()}});document.querySelectorAll('[data-focus]').forEach(function(x){x.onclick=function(){var id=Number(x.dataset.focus);S.selected=S.selected===id?null:id;draw()}})}document.querySelectorAll('.point-hit').forEach(function(x){x.onmousemove=function(e){var t=document.getElementById('tip'),b=document.querySelector('.plotbox').getBoundingClientRect();t.textContent=x.querySelector('title').textContent;t.style.display='block';t.style.left=(e.clientX-b.left+12)+'px';t.style.top=(e.clientY-b.top+12)+'px'};x.onmouseleave=function(){document.getElementById('tip').style.display='none'}});function tick(){if(!S.play)return;if(S.step>=S.data.future_steps-1){S.play=false;draw();return}S.step++;draw();setTimeout(tick,S.speed)}async function loadIndex(i){if(!S.manifest)return;if(i<0)i=S.manifest.samples.length-1;if(i>=S.manifest.samples.length)i=0;S.index=i;var r=await fetch(S.manifest.samples[i].file);S.data=await r.json();S.step=S.data.future_steps-1;S.selected=null;S.visible={};S.data.nodes.forEach(function(n){S.visible[n.node_id]=true});draw()}async function start(){try{if(window.__HDAAGT_DATA__){S.data=window.__HDAAGT_DATA__;S.data.nodes
